name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  # a warning, such as an unused import, fails the build
  RUSTFLAGS: -D warnings

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install libdbus
      run: sudo apt-get install -y libdbus-1-3 libdbus-1-dev
    # formatting uses nightly settings (`.rustfmt.toml`)
    - name: Install nightly
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: rustfmt
    - name: Install stable
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - name: Check formatting
      run: cargo +nightly fmt --check
    - name: Build
      run: cargo build --verbose
    # only the lints that check a core does no IO, see `clippy.toml` in each core's crate
    - name: Check the cores do no IO
      run: cargo clippy --workspace --all-targets -- -A clippy::all -D clippy::disallowed_methods -D clippy::disallowed_types
    - name: Run tests
      run: cargo test --verbose
